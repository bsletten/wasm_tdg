<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="data:;base64,=">
    <title>WebAssembly Threads</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem; max-width: 46rem; }
      pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
      .bad { color: #b00; font-weight: 600; }
      .good { color: #0a7a28; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>WebAssembly Threads</h1>
    <p id="isolation"></p>
    <p>
      Four pthreads, compiled by Emscripten to Web Workers sharing one
      <code>SharedArrayBuffer</code> as linear memory, summing slices of the
      same array.
    </p>
    <pre id="out">running...</pre>

    <!--
      GitHub Pages cannot set response headers, so on a static host the two
      cross-origin isolation headers have to come from somewhere else. This
      service worker re-serves the page with them and reloads once, which is
      enough to make SharedArrayBuffer available. When this directory is
      served by its own server.py, the real headers are already present and
      the worker is a no-op.
    -->
    <script src="coi-serviceworker.js"></script>

    <script>
      // Wrapped in a function on purpose. Emscripten's generated threads.js is
      // a classic script full of top-level `var` declarations -- including
      // `var out` and `var err`. A global `let`/`const` of the same name makes
      // that entire file fail to evaluate with "Identifier 'out' has already
      // been declared", before one line of it runs: the page just sits there
      // and the only clue is a SyntaxError in the console. Keeping our names
      // out of global scope avoids the whole class of problem. `Module` is the
      // one name that genuinely must be global, so it is set on `window`.
      (function () {
	  const outEl = document.getElementById("out");
	  const isoEl = document.getElementById("isolation");
	  const show = (text) => { outEl.textContent += text + "\n"; };

	  outEl.textContent = "";

	  if (window.crossOriginIsolated) {
	      isoEl.innerHTML = '<span class="good">crossOriginIsolated is true</span> &mdash; ' +
		  'SharedArrayBuffer is available.';
	  } else {
	      isoEl.innerHTML = '<span class="bad">crossOriginIsolated is false</span> &mdash; ' +
		  'SharedArrayBuffer is unavailable, so the error below is expected. ' +
		  'If the page has only just loaded, the service worker may still be ' +
		  'installing &mdash; reload once. Otherwise serve this directory with ' +
		  '<code>python3 server.py</code>, which sets the headers directly.';
	  }

	  // Emscripten's generated loader looks for these hooks on `Module`.
	  window.Module = {
	      print: show,
	      printErr: (text) => show("[stderr] " + text),
	      onAbort: (what) => show("[aborted] " + what)
	  };

	  // Surface failures on the page, not only in the console.
	  window.addEventListener("error", (e) => show("[error] " + (e.message || e.error)));
	  window.addEventListener("unhandledrejection", (e) => show("[unhandled rejection] " + e.reason));
      })();
    </script>

    <!--
      Loaded with a plain static tag rather than an injected one. Emscripten
      reads `document.currentScript.src` to get the URL it passes to
      `new Worker(...)` for each pthread, so the script must be one the browser
      is executing in the normal way.
    -->
    <script src="threads.js"></script>
  </body>
</html>
